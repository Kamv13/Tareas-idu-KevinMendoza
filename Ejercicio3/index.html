<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aplicacion de Arias</title>
  </head>
  <body>
    <section>
      <h1>Demostración de Roles ARIA Específicos</h1>
      <div role="radiogroup" aria-label="Opciones" id="radiogroup1">
        <input
          type="radio"
          id="atacar"
          value="false"
          role="radio"
          aria-labelledby="atacar"
        />
        <label for="atacar">Atacar</label>
        <input
          type="radio"
          id="defender"
          value="false"
          role="radio"
          aria-labelledby="defender"
        />
        <label for="defender">Defender</label>
      </div>
    </section>
    <section>
      <div role="table" aria-label="inventario" class="aria-table">
        <div role="row">
          <div role="columnheader">Consumibles</div>
          <div role="columnheader">Key Items</div>
          <div role="columnheader">Battle Items</div>
        </div>
      </div>
    </section>
    <section>
     <div role="img" aria-label="Encuentro de batalla con rattata">
      <img src="/Ejercicio3/Lighthouse/encuentro.jpg" alt="Encuentro con rattata" />
     </div>

    </section>
  </body>
</html>
