<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">


</head>
<body>
    
    <div class="container py-4">
        <div class="row g-4">

          <div class="col-12 col-sm-6 col-md-4 col-lg-3">
            <div class="card pizza-card">
              <img src="https://via.placeholder.com/300x200" class="card-img-top pizza-card__img" alt="Delicious Pizza 1" />
              <div class="card-body pizza-card__body">
                <h5 class="card-title pizza-card__title">Pizza Card 1</h5>
                <p class="card-text pizza-card__text">
                  Deliciosa pizza de pepperoni con queso mozzarela
                </p>
                <p class="pizza-card__price">PRICE: $10.00</p>
                <div class="pizza-card__quantity">
                  <label for="quantity1">Quantity:</label>
                  <input type="number" id="quantity1" name="quantity" min="1" value="1" />
                </div>
                <a href="#" class="btn btn-primary pizza-card__button">Order Now</a>
              </div>
            </div>
          </div>
    
          
          
        </div>
      </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
